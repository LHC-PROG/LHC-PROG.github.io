<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Li- / LHC-PROG。985高校计算机专业本科生，专业排名前2%，关注具身智能、VLA模型研究。">
  <title>Li- / LHC-PROG</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./profile.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要内容</a>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <a href="#top" class="logo" aria-label="返回顶部">
          <span class="logo__symbol">✳</span>
          <span class="logo__text" data-profile="handle">LHC-PROG</span>
        </a>
        <button class="theme-toggle" type="button" aria-label="切换主题">
          <span class="theme-toggle__icon"></span>
        </button>
      </div>
    </div>
    <div class="header__rule"></div>
  </header>

  <!-- Main Content -->
  <main id="main" class="main">
    <div class="container">

      <!-- Hero Section -->
      <section class="hero">
        <h1 class="hero__name" data-profile="name">Li-</h1>
        <p class="hero__tagline" data-profile="tagline">计算机科学与技术</p>
        <div class="hero__meta">
          <span data-profile="rank">专业排名前2%</span>
          <span class="hero__separator">·</span>
          <span data-profile="gpa">GPA 92+/100</span>
        </div>
        <p class="hero__interests" data-profile="interests_tag">AI Research · Embodied Intelligence</p>
        <div class="hero__bio" data-profile="bio">
          <p>关注机器学习、具身智能与大模型轻量化方向。</p>
        </div>
        <nav class="hero__links">
          <a href="https://github.com/LHC-PROG" class="link-button" target="_blank" rel="noopener noreferrer">
            <span>GitHub</span>
            <span class="link-button__arrow">↗</span>
          </a>
        </nav>
      </section>

      <!-- Research Section -->
      <section class="section">
        <h2 class="section__title">Research</h2>
        <div class="section__rule"></div>
        <div id="research-list" class="research-list"></div>
      </section>

      <!-- Skills Section -->
      <section class="section">
        <h2 class="section__title">Technical Skills</h2>
        <div class="section__rule"></div>
        <div id="skills-grid" class="skills-grid"></div>
      </section>

      <!-- Achievements Section -->
      <section class="section">
        <h2 class="section__title">Achievements & Honors</h2>
        <div class="section__rule"></div>
        <div id="achievements-list" class="achievements-list"></div>
      </section>

      <!-- Activities Section -->
      <section class="section">
        <h2 class="section__title">Activities & Leadership</h2>
        <div class="section__rule"></div>
        <div id="activities-list" class="activities-list"></div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__rule"></div>
      <div class="footer__content">
        <p>© 2024 Li- / LHC-PROG</p>
        <p class="footer__note">Built with passion for AI & Open Source</p>
      </div>
    </div>
  </footer>

</body>
</html>
